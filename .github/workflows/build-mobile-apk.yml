name: Build Mobile APK

# Manual only: this produces a debug-signed, side-loadable APK of the
# mobile/ Expo app for testing on your own device. GitHub's hosted
# ubuntu-latest runners ship with an Android SDK already installed, which
# is why this lives in CI rather than needing local Android tooling.
on:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild -p android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
